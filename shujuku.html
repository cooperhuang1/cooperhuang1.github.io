
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人文档库</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for 'Inter' -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons for a clean look -->
    <script src="https://unpkg.com/@phosphor-icons/web@2.0.3"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
        .modal {
            display: none;
        }
        .modal.open {
            display: flex;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Main Container -->
    <div class="max-w-7xl mx-auto p-4 md:p-8">

        <!-- Header Section for main library view -->
        <header id="main-header" class="bg-white rounded-2xl shadow-lg p-6 md:p-8 mb-8 flex flex-col md:flex-row justify-between items-center space-y-4 md:space-y-0">
            <div class="text-center md:text-left">
                <h1 class="text-3xl md:text-4xl font-bold text-gray-800">
                    我的个人文档库
                </h1>
                <p class="text-gray-500 mt-2 text-sm md:text-base">
                    在这里管理你所有的论文、讲义和笔记。
                </p>
            </div>
            
            <!-- Upload Button -->
            <div class="flex items-center space-x-4">
                <label for="file-upload" class="cursor-pointer bg-indigo-600 text-white font-semibold py-2 px-6 rounded-full shadow-md hover:bg-indigo-700 transition-colors duration-300 transform hover:scale-105">
                    <i class="ph ph-upload-simple text-lg mr-2"></i> 上传新文件
                </label>
                <input id="file-upload" type="file" class="hidden" multiple>
            </div>
        </header>

        <!-- Main Library View -->
        <main id="main-library-view">
            <!-- Main Content Area -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">

                <!-- Sidebar for Filters and Sorting -->
                <aside class="col-span-1 bg-white rounded-2xl shadow-lg p-6 h-fit sticky top-28">
                    <h3 class="text-lg font-bold text-gray-800 mb-4">筛选条件</h3>
                    <div class="space-y-2 mb-6" id="filter-buttons-container">
                        <button class="filter-btn w-full text-left py-2 px-4 rounded-lg font-medium transition-colors duration-200 bg-indigo-100 text-indigo-700 hover:bg-indigo-200" data-filter="all">
                            <i class="ph ph-list-dashes text-lg mr-2"></i> 所有文件
                        </button>
                        <button class="filter-btn w-full text-left py-2 px-4 rounded-lg font-medium transition-colors duration-200 text-gray-700 hover:bg-gray-100" data-filter="论文">
                            <i class="ph ph-scroll-simple-text text-lg mr-2"></i> 论文
                        </button>
                        <button class="filter-btn w-full text-left py-2 px-4 rounded-lg font-medium transition-colors duration-200 text-gray-700 hover:bg-gray-100" data-filter="讲义">
                            <i class="ph ph-file-pdf text-lg mr-2"></i> 讲义
                        </button>
                        <button class="filter-btn w-full text-left py-2 px-4 rounded-lg font-medium transition-colors duration-200 text-gray-700 hover:bg-gray-100" data-filter="笔记">
                            <i class="ph ph-notepad text-lg mr-2"></i> 笔记
                        </button>
                        <button class="filter-btn w-full text-left py-2 px-4 rounded-lg font-medium transition-colors duration-200 text-gray-700 hover:bg-gray-100" data-filter="网课">
                            <i class="ph ph-monitor-play text-lg mr-2"></i> 网课
                        </button>
                    </div>

                    <h3 class="text-lg font-bold text-gray-800 mb-4 border-t pt-4">排序方式</h3>
                    <div class="space-y-2">
                        <button class="sort-btn w-full text-left py-2 px-4 rounded-lg font-medium transition-colors duration-200 text-gray-700 hover:bg-gray-100" data-sort="title">
                            <i class="ph ph-sort-by-alpha text-lg mr-2"></i> 按标题
                        </button>
                        <button class="sort-btn w-full text-left py-2 px-4 rounded-lg font-medium transition-colors duration-200 text-gray-700 hover:bg-gray-100" data-sort="date">
                            <i class="ph ph-calendar text-lg mr-2"></i> 按日期
                        </button>
                    </div>
                </aside>

                <!-- Document List -->
                <div class="md:col-span-3">

                    <!-- Search Bar -->
                    <div class="mb-6">
                        <div class="relative">
                            <i class="ph ph-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                            <input type="text" id="search-input" placeholder="按标题、作者或类型搜索..." class="w-full pl-12 pr-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 shadow-sm">
                        </div>
                    </div>

                    <!-- Loading state -->
                    <div id="loading-state" class="text-center text-gray-500 py-12">
                        <p class="text-xl">
                            <i class="ph ph-spinner-gap animate-spin text-4xl text-indigo-500"></i>
                        </p>
                        <p class="mt-2 text-sm">正在加载文档...</p>
                    </div>

                    <!-- Document Grid -->
                    <div id="document-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                        <!-- Document cards will be rendered here by JavaScript -->
                    </div>

                    <!-- No Results Message -->
                    <div id="no-results" class="hidden text-center text-gray-500 py-12">
                        <p class="text-xl">未找到匹配的文档。</p>
                        <p class="mt-2 text-sm">请尝试其他搜索关键词或筛选条件。</p>
                    </div>
                </div>
            </div>
        </main>

        <!-- Course Detail View (Initially hidden) -->
        <div id="course-detail-view" class="hidden">
            <!-- Course Header -->
            <div id="course-header" class="bg-indigo-700 text-white rounded-2xl shadow-lg p-6 md:p-8 mb-8">
                <button id="back-button" class="flex items-center text-indigo-100 hover:text-white transition-colors duration-200 mb-4">
                    <i class="ph ph-arrow-left text-xl mr-2"></i>
                    返回文档库
                </button>
                <div class="flex items-center space-x-4">
                    <div class="p-3 bg-white bg-opacity-20 rounded-full">
                        <i class="ph ph-monitor-play text-3xl"></i>
                    </div>
                    <div>
                        <h1 id="course-title" class="text-3xl md:text-4xl font-bold">课程标题</h1>
                        <p class="mt-1 text-indigo-200 text-sm md:text-base">
                            <span id="course-department" class="font-semibold"></span> | 
                            讲师: <span id="course-instructor"></span>
                        </p>
                    </div>
                </div>
            </div>

            <!-- Main content for course details -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                <!-- Left Sidebar for course navigation -->
                <aside class="col-span-1 bg-white rounded-2xl shadow-lg p-6 h-fit sticky top-28">
                    <h3 class="text-lg font-bold text-gray-800 mb-4">课程导航</h3>
                    <div id="course-nav-links" class="space-y-2">
                        <!-- Links will be populated here by JS -->
                    </div>
                </aside>

                <!-- Main content area -->
                <div class="md:col-span-3">
                    <div class="bg-white rounded-2xl shadow-lg p-6 mb-6">
                        <h2 class="text-xl font-bold text-gray-800 mb-4">课程简介</h2>
                        <p id="course-description" class="text-gray-600 leading-relaxed"></p>
                    </div>

                    <div class="bg-white rounded-2xl shadow-lg p-6">
                        <h2 class="text-xl font-bold text-gray-800 mb-4">学习资料类型</h2>
                        <div id="course-resources" class="flex flex-wrap gap-2 mt-2">
                            <!-- Resource tags will be populated here by JS -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- User ID display -->
    <div id="user-info" class="fixed bottom-4 right-4 bg-gray-800 text-white text-xs px-4 py-2 rounded-full shadow-lg">
        <span id="user-id"></span>
    </div>

    <!-- Edit Document Modal -->
    <div id="edit-modal" class="modal fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-lg w-full max-w-lg p-6 relative">
            <h3 class="text-2xl font-bold text-gray-800 mb-4">编辑文档</h3>
            <form id="edit-form">
                <input type="hidden" id="edit-doc-id">
                <div class="mb-4">
                    <label for="edit-title" class="block text-sm font-medium text-gray-700">标题</label>
                    <input type="text" id="edit-title" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
                <div class="mb-4">
                    <label for="edit-author" class="block text-sm font-medium text-gray-700">作者</label>
                    <input type="text" id="edit-author" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
                <div class="mb-4">
                    <label for="edit-type" class="block text-sm font-medium text-gray-700">类型</label>
                    <select id="edit-type" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                        <option value="论文">论文</option>
                        <option value="讲义">讲义</option>
                        <option value="笔记">笔记</option>
                        <option value="网课">网课</option>
                    </select>
                </div>
                <div class="flex justify-end space-x-4">
                    <button type="button" id="cancel-edit" class="inline-flex justify-center py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none">
                        取消
                    </button>
                    <button type="submit" class="inline-flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none">
                        保存更改
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="delete-modal" class="modal fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-lg w-full max-w-sm p-6 relative">
            <h3 class="text-2xl font-bold text-gray-800 mb-4">确认删除</h3>
            <p class="text-gray-600 mb-6">你确定要删除这个文档吗？此操作无法撤销。</p>
            <div class="flex justify-end space-x-4">
                <button type="button" id="cancel-delete" class="inline-flex justify-center py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none">
                    取消
                </button>
                <button type="button" id="confirm-delete" class="inline-flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-red-600 hover:bg-red-700 focus:outline-none">
                    删除
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript for dynamic content and interactivity -->
    <script type="module">
        // Firebase and Firestore imports
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot, collection, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js";

        // Global variables provided by the environment
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const authToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        // Initialize Firebase services
        let app, db, auth;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            try {
                const analytics = getAnalytics(app); 
            } catch (e) {
                console.warn("Firebase Analytics could not be initialized. This is expected if it's not configured.");
            }
        } catch (error) {
            console.error("Firebase initialization failed:", error);
        }

        let userId = null;
        let documentsCollectionRef = null;
        let allDocuments = [];

        // Get DOM elements
        const mainHeader = document.getElementById('main-header');
        const mainLibraryView = document.getElementById('main-library-view');
        const courseDetailView = document.getElementById('course-detail-view');
        const documentGrid = document.getElementById('document-grid');
        const searchInput = document.getElementById('search-input');
        const filterButtonsContainer = document.getElementById('filter-buttons-container');
        const sortButtons = document.querySelectorAll('.sort-btn');
        const noResultsMessage = document.getElementById('no-results');
        const loadingState = document.getElementById('loading-state');
        const fileUploadInput = document.getElementById('file-upload');
        const backButton = document.getElementById('back-button');
        const courseNavLinksContainer = document.getElementById('course-nav-links');
        const userIdDisplay = document.getElementById('user-id');

        // Modal-related elements
        const editModal = document.getElementById('edit-modal');
        const editForm = document.getElementById('edit-form');
        const editTitleInput = document.getElementById('edit-title');
        const editAuthorInput = document.getElementById('edit-author');
        const editTypeSelect = document.getElementById('edit-type');
        const editDocIdInput = document.getElementById('edit-doc-id');

        const deleteModal = document.getElementById('delete-modal');
        const confirmDeleteButton = document.getElementById('confirm-delete');
        
        let currentFilter = 'all'; 
        let currentSearch = '';
        let currentSort = 'date'; 
        let activeCourse = null;
        let docToDelete = null;

        // --- Modal Control Functions ---
        // New, more robust modal control functions with event propagation handling
        function openEditModal(doc) {
            closeAllModals(); // Close any other open modals
            editDocIdInput.value = doc.id;
            editTitleInput.value = doc.title;
            editAuthorInput.value = doc.author;
            editTypeSelect.value = doc.type;
            editModal.classList.add('open');
        }

        function closeEditModal() {
            editModal.classList.remove('open');
        }

        function openDeleteModal(docId) {
            closeAllModals(); // Close any other open modals
            docToDelete = docId;
            deleteModal.classList.add('open');
        }
        
        function closeDeleteModal() {
            docToDelete = null;
            deleteModal.classList.remove('open');
        }
        
        function closeAllModals() {
            closeEditModal();
            closeDeleteModal();
        }

        // --- Other App Functions ---
        function handleNavLinkClick(event) {
            const href = event.currentTarget.getAttribute('href');
            if (href && href.startsWith('#')) {
                event.preventDefault();
                const targetId = href.substring(1);
                const targetElement = document.getElementById(targetId);
                if (targetElement) {
                    window.scrollTo({
                        top: targetElement.offsetTop - 100, 
                        behavior: 'smooth'
                    });
                }
            }
        }
        
        function showCourseDetail(course) {
            activeCourse = course;
            mainLibraryView.classList.add('hidden');
            mainHeader.classList.add('hidden');
            courseDetailView.classList.remove('hidden');

            document.getElementById('course-title').textContent = course.title;
            document.getElementById('course-department').textContent = course.department;
            document.getElementById('course-instructor').textContent = course.instructor;
            document.getElementById('course-description').textContent = course.description;

            courseNavLinksContainer.innerHTML = '';
            course.nav.forEach(navItem => {
                const navLink = document.createElement('a');
                navLink.href = navItem.link;
                navLink.className = 'flex items-center gap-2 w-full text-left py-2 px-4 rounded-lg font-medium transition-colors duration-200 text-gray-700 hover:bg-gray-100';
                navLink.innerHTML = `<i class="ph ph-link text-lg"></i><span>${navItem.title}</span>`;

                if (!navItem.link.startsWith('#')) {
                    navLink.target = '_blank';
                    navLink.rel = 'noopener noreferrer';
                } else {
                    navLink.addEventListener('click', handleNavLinkClick);
                }
                
                courseNavLinksContainer.appendChild(navLink);
            });

            const resourcesContainer = document.getElementById('course-resources');
            resourcesContainer.innerHTML = course.resources.map(resource => `
                <span class="text-xs font-semibold px-2 py-1 rounded-full text-gray-700 bg-gray-100">${resource}</span>
            `).join('');
        }
        
        function showMainLibrary() {
            courseDetailView.classList.add('hidden');
            mainLibraryView.classList.remove('hidden');
            mainHeader.classList.remove('hidden');
            activeCourse = null;
        }

        function sortDocuments(docs) {
            return docs.sort((a, b) => {
                const dateA = a[currentSort];
                const dateB = b[currentSort];
                
                if (currentSort === 'date') {
                    return new Date(dateB) - new Date(dateA);
                } else {
                    return dateA.localeCompare(dateB);
                }
            });
        }

        function renderDocuments() {
            loadingState.classList.add('hidden');
            
            const filteredByType = currentFilter === 'all'
                ? allDocuments
                : allDocuments.filter(doc => doc.type === currentFilter);
            
            const filteredBySearch = filteredByType.filter(doc => 
                doc.title.toLowerCase().includes(currentSearch.toLowerCase()) ||
                doc.author.toLowerCase().includes(currentSearch.toLowerCase()) ||
                doc.type.toLowerCase().includes(currentSearch.toLowerCase())
            );

            const sortedDocuments = sortDocuments(filteredBySearch);
            documentGrid.innerHTML = '';
            
            if (sortedDocuments.length > 0) {
                noResultsMessage.classList.add('hidden');
                sortedDocuments.forEach(doc => {
                    documentGrid.appendChild(renderDocumentCard(doc));
                });
            } else {
                noResultsMessage.classList.remove('hidden');
            }
        }

        function renderDocumentCard(doc) {
            const card = document.createElement('div');
            card.className = 'bg-white rounded-xl shadow-md p-6 flex flex-col justify-between transition-transform duration-300 hover:scale-[1.02] hover:shadow-xl border border-gray-200';
            
            const contentDiv = document.createElement('div');
            
            const typeSpan = document.createElement('span');
            typeSpan.className = 'inline-block text-xs font-semibold px-2 py-1 rounded-full text-indigo-700 bg-indigo-100 mb-3';
            typeSpan.textContent = doc.type;
            contentDiv.appendChild(typeSpan);

            const titleH4 = document.createElement('h4');
            titleH4.className = 'text-lg font-bold text-gray-800 mb-2';
            titleH4.textContent = doc.title;
            contentDiv.appendChild(titleH4);

            const authorP = document.createElement('p');
            authorP.className = 'text-sm text-gray-500 mb-4';
            authorP.textContent = `作者: ${doc.author}`;
            contentDiv.appendChild(authorP);
            
            card.appendChild(contentDiv);

            const footerDiv = document.createElement('div');
            footerDiv.className = 'flex items-center justify-between mt-4 border-t pt-4';

            const dateP = document.createElement('p');
            dateP.className = 'text-xs text-gray-400';
            dateP.textContent = `上传日期: ${doc.date}`;
            footerDiv.appendChild(dateP);
            
            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'flex items-center space-x-2';

            const editButton = document.createElement('button');
            editButton.className = 'p-2 rounded-full text-gray-400 hover:text-indigo-600 hover:bg-gray-100 transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-500';
            editButton.innerHTML = '<i class="ph ph-pencil-simple text-base"></i>';
            editButton.addEventListener('click', (e) => {
                e.stopPropagation(); // Stop event propagation
                const docToEdit = allDocuments.find(d => d.id === doc.id);
                if (docToEdit) {
                    openEditModal(docToEdit);
                }
            });
            actionsDiv.appendChild(editButton);

            const deleteButton = document.createElement('button');
            deleteButton.className = 'p-2 rounded-full text-gray-400 hover:text-red-600 hover:bg-gray-100 transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-red-500';
            deleteButton.innerHTML = '<i class="ph ph-trash text-base"></i>';
            deleteButton.addEventListener('click', (e) => {
                e.stopPropagation(); // Stop event propagation
                openDeleteModal(doc.id);
            });
            actionsDiv.appendChild(deleteButton);
            
            const linkA = document.createElement('a');
            linkA.href = doc.link;
            linkA.className = 'inline-flex items-center text-indigo-600 hover:text-indigo-800 font-semibold transition-colors duration-200 ml-2';
            linkA.innerHTML = `<i class="ph ph-${doc.type === '网课' ? 'play-circle' : 'download-simple'} text-base mr-1"></i> ${doc.type === '网课' ? '查看' : '下载'}`;

            if (doc.type === '网课') {
                linkA.target = '_blank';
                linkA.rel = 'noopener noreferrer';
                card.classList.add('cursor-pointer');
                card.addEventListener('click', () => showCourseDetail(doc));
            } else {
                linkA.download = true; 
            }
            actionsDiv.appendChild(linkA);

            footerDiv.appendChild(actionsDiv);
            card.appendChild(footerDiv);

            return card;
        }

        // --- Event Listeners ---
        searchInput.addEventListener('keyup', (e) => {
            currentSearch = e.target.value;
            renderDocuments();
        });

        filterButtonsContainer.addEventListener('click', (e) => {
            const button = e.target.closest('.filter-btn');
            if (button) {
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.classList.remove('bg-indigo-100', 'text-indigo-700');
                    btn.classList.add('text-gray-700', 'hover:bg-gray-100');
                });
                button.classList.remove('text-gray-700', 'hover:bg-gray-100');
                button.classList.add('bg-indigo-100', 'text-indigo-700');

                currentFilter = button.dataset.filter;
                renderDocuments();
            }
        });
        
        sortButtons.forEach(button => {
            button.addEventListener('click', () => {
                sortButtons.forEach(btn => {
                    btn.classList.remove('bg-indigo-100', 'text-indigo-700');
                    btn.classList.add('text-gray-700', 'hover:bg-gray-100');
                });
                button.classList.remove('text-gray-700', 'hover:bg-gray-100');
                button.classList.add('bg-indigo-100', 'text-indigo-700');

                currentSort = button.dataset.sort;
                renderDocuments();
            });
        });
        
        backButton.addEventListener('click', showMainLibrary);
        
        fileUploadInput.addEventListener('change', async (e) => {
            const files = e.target.files;
            if (files.length > 0) {
                const file = files[0];
                const newDoc = {
                    title: file.name,
                    type: '讲义', 
                    author: `用户 ${userId}`,
                    date: new Date().toISOString().slice(0, 10), 
                    link: 'https://example.com/placeholder-link'
                };
                
                try {
                    await addDoc(documentsCollectionRef, newDoc);
                    console.log("Document added successfully!");
                } catch (error) {
                    console.error("Error adding document:", error);
                }
                e.target.value = '';
            }
        });

        editForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const docId = editDocIdInput.value;
            const docRef = doc(db, `artifacts/${appId}/users/${userId}/documents/${docId}`);
            
            const updatedData = {
                title: editTitleInput.value,
                author: editAuthorInput.value,
                type: editTypeSelect.value
            };

            try {
                await updateDoc(docRef, updatedData);
                console.log("Document updated successfully!");
                closeEditModal();
            } catch (error) {
                console.error("Error updating document:", error);
            }
        });

        confirmDeleteButton.addEventListener('click', async () => {
            if (docToDelete) {
                const docRef = doc(db, `artifacts/${appId}/users/${userId}/documents/${docToDelete}`);
                try {
                    await deleteDoc(docRef);
                    console.log("Document deleted successfully!");
                    closeDeleteModal();
                } catch (error) {
                    console.error("Error deleting document:", error);
                }
            }
        });

        // Use more specific IDs for modal close buttons for clarity
        document.getElementById('cancel-edit').addEventListener('click', closeEditModal);
        document.getElementById('cancel-delete').addEventListener('click', closeDeleteModal);

        editModal.addEventListener('click', (e) => {
            if (e.target === editModal) {
                closeEditModal();
            }
        });

        deleteModal.addEventListener('click', (e) => {
            if (e.target === deleteModal) {
                closeDeleteModal();
            }
        });
        
        // --- Firebase Auth & Data Loading ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                userId = user.uid;
                userIdDisplay.textContent = `用户ID: ${userId}`;
                documentsCollectionRef = collection(db, `artifacts/${appId}/users/${userId}/documents`);

                onSnapshot(documentsCollectionRef, async (snapshot) => {
                    const docs = snapshot.docs.map(d => ({ ...d.data(), id: d.id }));
                    allDocuments = docs;
                    
                    if (docs.length === 0) {
                        await populateInitialData();
                    } else {
                        renderDocuments();
                    }
                }, (error) => {
                    console.error("Error fetching documents:", error);
                    loadingState.classList.add('hidden');
                    noResultsMessage.textContent = "无法加载文档，请检查网络连接。";
                    noResultsMessage.classList.remove('hidden');
                });
            } else {
                console.log("No user signed in.");
            }
        });

        async function authenticateAndLoad() {
            try {
                if (authToken) {
                    await signInWithCustomToken(auth, authToken);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Authentication failed:", error);
                loadingState.classList.add('hidden');
                noResultsMessage.textContent = "认证失败，无法加载文档。";
                noResultsMessage.classList.remove('hidden');
            }
        }
