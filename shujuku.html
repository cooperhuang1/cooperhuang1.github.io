<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人文档库</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for 'Inter' -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons for a clean look -->
    <script src="https://unpkg.com/@phosphor-icons/web@2.0.3"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
        /* The modal should be hidden by default */
        .modal {
            display: none;
            /* Using a higher z-index to ensure modals are on top */
            z-index: 1000;
        }
        /* The modal will be displayed as a flex container when the 'open' class is added */
        .modal.open {
            display: flex;
        }
        .ai-image-container, .uploaded-file-container {
            width: 100%;
            height: 120px; /* Fixed height for preview */
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f1f5f9;
            border-radius: 0.5rem;
            overflow: hidden;
            position: relative;
        }
        .uploaded-file-container.is-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .uploaded-file-container.is-pdf {
            flex-direction: column;
            gap: 0.5rem;
            padding: 1rem;
            color: #4b5563;
        }
        .ai-image-container .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(4px);
            z-index: 10;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Main Container -->
    <div class="max-w-7xl mx-auto p-4 md:p-8">

        <!-- Header Section for main library view -->
        <header id="main-header" class="bg-white rounded-2xl shadow-lg p-6 md:p-8 mb-8 flex flex-col md:flex-row justify-between items-center space-y-4 md:space-y-0">
            <div class="text-center md:text-left">
                <h1 class="text-3xl md:text-4xl font-bold text-gray-800">
                    我的个人文档库
                </h1>
                <p class="text-gray-500 mt-2 text-sm md:text-base">
                    在这里管理你所有的论文、讲义和笔记。
                </p>
            </div>
            
            <!-- Add New Document Button -->
            <div class="flex items-center space-x-4">
                <button id="add-new-doc-btn" class="cursor-pointer bg-indigo-600 text-white font-semibold py-2 px-6 rounded-full shadow-md hover:bg-indigo-700 transition-colors duration-300 transform hover:scale-105">
                    <i class="ph ph-plus-circle text-lg mr-2"></i> 新增文档
                </button>
            </div>
        </header>

        <!-- Main Library View -->
        <main id="main-library-view">
            <!-- Main Content Area -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">

                <!-- Sidebar for Filters and Sorting -->
                <aside class="col-span-1 bg-white rounded-2xl shadow-lg p-6 h-fit sticky top-28">
                    <h3 class="text-lg font-bold text-gray-800 mb-4">筛选条件</h3>
                    <div class="space-y-2 mb-6" id="filter-buttons-container">
                        <button class="filter-btn w-full text-left py-2 px-4 rounded-lg font-medium transition-colors duration-200 bg-indigo-100 text-indigo-700 hover:bg-indigo-200" data-filter="all">
                            <i class="ph ph-list-dashes text-lg mr-2"></i> 所有文件
                        </button>
                        <button class="filter-btn w-full text-left py-2 px-4 rounded-lg font-medium transition-colors duration-200 text-gray-700 hover:bg-gray-100" data-filter="论文">
                            <i class="ph ph-scroll-simple-text text-lg mr-2"></i> 论文
                        </button>
                        <button class="filter-btn w-full text-left py-2 px-4 rounded-lg font-medium transition-colors duration-200 text-gray-700 hover:bg-gray-100" data-filter="讲义">
                            <i class="ph ph-file-pdf text-lg mr-2"></i> 讲义
                        </button>
                        <button class="filter-btn w-full text-left py-2 px-4 rounded-lg font-medium transition-colors duration-200 text-gray-700 hover:bg-gray-100" data-filter="笔记">
                            <i class="ph ph-notepad text-lg mr-2"></i> 笔记
                        </button>
                        <button class="filter-btn w-full text-left py-2 px-4 rounded-lg font-medium transition-colors duration-200 text-gray-700 hover:bg-gray-100" data-filter="网课">
                            <i class="ph ph-monitor-play text-lg mr-2"></i> 网课
                        </button>
                    </div>

                    <h3 class="text-lg font-bold text-gray-800 mb-4 border-t pt-4">排序方式</h3>
                    <div class="space-y-2">
                        <button class="sort-btn w-full text-left py-2 px-4 rounded-lg font-medium transition-colors duration-200 text-gray-700 hover:bg-gray-100" data-sort="title">
                            <i class="ph ph-sort-by-alpha text-lg mr-2"></i> 按标题
                        </button>
                        <button class="sort-btn w-full text-left py-2 px-4 rounded-lg font-medium transition-colors duration-200 text-gray-700 hover:bg-gray-100" data-sort="date">
                            <i class="ph ph-calendar text-lg mr-2"></i> 按日期
                        </button>
                    </div>
                </aside>

                <!-- Document List -->
                <div class="md:col-span-3">

                    <!-- Search Bar -->
                    <div class="mb-6">
                        <div class="relative">
                            <i class="ph ph-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                            <input type="text" id="search-input" placeholder="按标题、作者或类型搜索..." class="w-full pl-12 pr-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 shadow-sm">
                        </div>
                    </div>

                    <!-- Loading state -->
                    <div id="loading-state" class="text-center text-gray-500 py-12">
                        <p class="text-xl">
                            <i class="ph ph-spinner-gap animate-spin text-4xl text-indigo-500"></i>
                        </p>
                        <p class="mt-2 text-sm">正在加载文档...</p>
                    </div>

                    <!-- Document Grid -->
                    <div id="document-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                        <!-- Document cards will be rendered here by JavaScript -->
                    </div>

                    <!-- No Results Message -->
                    <div id="no-results" class="hidden text-center text-gray-500 py-12">
                        <p class="text-xl">未找到匹配的文档。</p>
                        <p class="mt-2 text-sm">请尝试其他搜索关键词或筛选条件，或点击右上角“新增文档”。</p>
                    </div>
                </div>
            </div>
        </main>

        <!-- Course Detail View (Initially hidden) -->
        <div id="course-detail-view" class="hidden">
            <!-- Course Header -->
            <div id="course-header" class="bg-indigo-700 text-white rounded-2xl shadow-lg p-6 md:p-8 mb-8">
                <button id="back-button" class="flex items-center text-indigo-100 hover:text-white transition-colors duration-200 mb-4">
                    <i class="ph ph-arrow-left text-xl mr-2"></i>
                    返回文档库
                </button>
                <div class="flex items-center space-x-4">
                    <div class="p-3 bg-white bg-opacity-20 rounded-full">
                        <i class="ph ph-monitor-play text-3xl"></i>
                    </div>
                    <div>
                        <h1 id="course-title" class="text-3xl md:text-4xl font-bold">课程标题</h1>
                        <p class="mt-1 text-indigo-200 text-sm md:text-base">
                            <span id="course-department" class="font-semibold"></span> | 
                            讲师: <span id="course-instructor"></span>
                        </p>
                    </div>
                </div>
            </div>

            <!-- Main content for course details -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                <!-- Left Sidebar for course navigation -->
                <aside class="col-span-1 bg-white rounded-2xl shadow-lg p-6 h-fit sticky top-28">
                    <h3 class="text-lg font-bold text-gray-800 mb-4">课程导航</h3>
                    <div id="course-nav-links" class="space-y-2">
                        <!-- Links will be populated here by JS -->
                    </div>
                </aside>

                <!-- Main content area -->
                <div class="md:col-span-3">
                    <div class="bg-white rounded-2xl shadow-lg p-6 mb-6">
                        <h2 class="text-xl font-bold text-gray-800 mb-4">课程简介</h2>
                        <p id="course-description" class="text-gray-600 leading-relaxed"></p>
                    </div>

                    <div class="bg-white rounded-2xl shadow-lg p-6">
                        <h2 class="text-xl font-bold text-gray-800 mb-4">学习资料类型</h2>
                        <div id="course-resources" class="flex flex-wrap gap-2 mt-2">
                            <!-- Resource tags will be populated here by JS -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- User ID display -->
    <div id="user-info" class="fixed bottom-4 right-4 bg-gray-800 text-white text-xs px-4 py-2 rounded-full shadow-lg">
        <span id="user-id"></span>
    </div>

    <!-- Add New Document Modal -->
    <div id="add-modal" class="modal fixed inset-0 bg-gray-900 bg-opacity-50 items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-lg w-full max-w-lg p-6 relative">
            <h3 class="text-2xl font-bold text-gray-800 mb-4">新增文档</h3>
            <form id="add-form">
                <div class="mb-4">
                    <label for="add-title" class="block text-sm font-medium text-gray-700">标题</label>
                    <input type="text" id="add-title" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" required>
                </div>
                <div class="mb-4">
                    <label for="add-type" class="block text-sm font-medium text-gray-700">类型</label>
                    <select id="add-type" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                        <option value="论文">论文</option>
                        <option value="讲义">讲义</option>
                        <option value="笔记">笔记</option>
                        <option value="网课">网课</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label for="add-author" class="block text-sm font-medium text-gray-700">作者</label>
                    <input type="text" id="add-author" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" required>
                </div>

                <!-- NEW: AI Image Generation Section -->
                <div class="mb-4">
                    <label for="image-prompt" class="block text-sm font-medium text-gray-700">AI图片生成提示词 (可选)</label>
                    <input type="text" id="image-prompt" placeholder="描述你想要的图片，例如：'一只在月亮上打字的猫咪'" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
                <div class="flex justify-end mb-4">
                    <button type="button" id="generate-image-btn" class="inline-flex items-center justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none">
                        <i class="ph ph-magic-wand text-lg mr-2"></i> 生成图片
                    </button>
                </div>
                <div id="ai-image-preview-container" class="hidden relative mb-4">
                    <div class="ai-image-container">
                        <div id="ai-image-loading-overlay" class="loading-overlay hidden">
                            <i class="ph ph-spinner-gap animate-spin text-4xl text-indigo-500"></i>
                        </div>
                        <img id="ai-image-preview" alt="AI Generated Image" class="w-full h-full object-cover">
                    </div>
                    <button type="button" id="clear-image-btn" class="absolute top-2 right-2 p-1 text-red-500 bg-white rounded-full shadow-md hover:bg-gray-100 transition-colors">
                        <i class="ph ph-x-circle text-lg"></i>
                    </button>
                </div>

                <!-- Separator -->
                <div class="relative flex py-5 items-center">
                    <div class="flex-grow border-t border-gray-300"></div>
                    <span class="flex-shrink mx-4 text-gray-500 text-sm">或者</span>
                    <div class="flex-grow border-t border-gray-300"></div>
                </div>

                <!-- UPDATED: File Upload Section (now supports images and PDFs) -->
                <div class="mb-4">
                    <label for="add-link" class="block text-sm font-medium text-gray-700">文件链接 (可选)</label>
                    <input type="url" id="add-link" placeholder="例如: https://example.com/document.pdf" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
                <div class="mb-4">
                    <label for="file-upload" class="block text-sm font-medium text-gray-700">上传文件 (可选)</label>
                    <input type="file" id="file-upload" accept="image/*, .pdf" class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-violet-50 file:text-violet-700 hover:file:bg-violet-100">
                </div>
                <div id="uploaded-file-preview-container" class="hidden relative mb-4">
                    <div id="uploaded-file-container" class="uploaded-file-container">
                        <i id="uploaded-file-icon" class="ph ph-file-pdf text-4xl"></i>
                        <img id="uploaded-image-preview" alt="Uploaded File Preview" class="hidden w-full h-full object-cover">
                        <span id="uploaded-file-name" class="text-sm font-medium text-center line-clamp-2"></span>
                    </div>
                    <button type="button" id="clear-uploaded-file-btn" class="absolute top-2 right-2 p-1 text-red-500 bg-white rounded-full shadow-md hover:bg-gray-100 transition-colors">
                        <i class="ph ph-x-circle text-lg"></i>
                    </button>
                </div>
                
                <!-- Conditional fields for online course -->
                <div id="add-course-fields" class="hidden">
                    <div class="mb-4">
                        <label for="add-course-description" class="block text-sm font-medium text-gray-700">课程简介</label>
                        <textarea id="add-course-description" rows="3" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"></textarea>
                    </div>
                    <div class="mb-4">
                        <label for="add-course-instructor" class="block text-sm font-medium text-gray-700">讲师</label>
                        <input type="text" id="add-course-instructor" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                    </div>
                    <div class="mb-4">
                        <label for="add-course-department" class="block text-sm font-medium text-gray-700">所属院系</label>
                        <input type="text" id="add-course-department" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                    </div>
                    <!-- Simplified fields for resources and navigation. In a real app, these would be dynamic -->
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700">学习资料类型 (用逗号分隔)</label>
                        <input type="text" id="add-course-resources" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="例如: 讲义, 习题集">
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700">课程导航 (JSON格式)</label>
                        <textarea id="add-course-nav" rows="2" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder='[{"title": "简介", "link": "#"}, {"title": "讲义", "link": "https://"}]'></textarea>
                    </div>
                </div>

                <div class="flex justify-end space-x-4">
                    <button type="button" id="cancel-add" class="inline-flex justify-center py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none">
                        取消
                    </button>
                    <button type="submit" id="submit-add" class="inline-flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none">
                        保存文档
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Document Modal -->
    <div id="edit-modal" class="modal fixed inset-0 bg-gray-900 bg-opacity-50 items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-lg w-full max-w-lg p-6 relative">
            <h3 class="text-2xl font-bold text-gray-800 mb-4">编辑文档</h3>
            <form id="edit-form">
                <input type="hidden" id="edit-doc-id">
                <div class="mb-4">
                    <label for="edit-title" class="block text-sm font-medium text-gray-700">标题</label>
                    <input type="text" id="edit-title" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
                <div class="mb-4">
                    <label for="edit-author" class="block text-sm font-medium text-gray-700">作者</label>
                    <input type="text" id="edit-author" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
                <div class="mb-4">
                    <label for="edit-type" class="block text-sm font-medium text-gray-700">类型</label>
                    <select id="edit-type" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                        <option value="论文">论文</option>
                        <option value="讲义">讲义</option>
                        <option value="笔记">笔记</option>
                        <option value="网课">网课</option>
                    </select>
                </div>
                <div class="flex justify-end space-x-4">
                    <button type="button" id="cancel-edit" class="inline-flex justify-center py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none">
                        取消
                    </button>
                    <button type="submit" class="inline-flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none">
                        保存更改
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="delete-modal" class="modal fixed inset-0 bg-gray-900 bg-opacity-50 items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-lg w-full max-w-sm p-6 relative">
            <h3 class="text-2xl font-bold text-gray-800 mb-4">确认删除</h3>
            <p class="text-gray-600 mb-6">你确定要删除这个文档吗？此操作无法撤销。</p>
            <div class="flex justify-end space-x-4">
                <button type="button" id="cancel-delete" class="inline-flex justify-center py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none">
                        取消
                    </button>
                    <button type="button" id="confirm-delete" class="inline-flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-red-600 hover:bg-red-700 focus:outline-none">
                        删除
                    </button>
            </div>
        </div>
    </div>

    <!-- JavaScript for dynamic content and interactivity -->
    <script type="module">
        // Firebase and Firestore imports
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot, collection, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js";

        // Global variables provided by the environment
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const authToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        // Initialize Firebase services
        let app, db, auth;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            try {
                const analytics = getAnalytics(app); 
            } catch (e) {
                console.warn("Firebase Analytics could not be initialized. This is expected if it's not configured.");
            }
        } catch (error) {
            console.error("Firebase initialization failed:", error);
        }

        // --- State Management Variables ---
        let userId = null;
        let documentsCollectionRef = null;
        let allDocuments = [];
        let currentFilter = 'all'; 
        let currentSearch = '';
        let currentSort = 'date'; 
        let activeCourse = null;
        let docToDelete = null;
        let unsubscribe = null; // To hold the listener cleanup function

        // --- DOM Elements ---
        const mainHeader = document.getElementById('main-header');
        const mainLibraryView = document.getElementById('main-library-view');
        const courseDetailView = document.getElementById('course-detail-view');
        const documentGrid = document.getElementById('document-grid');
        const searchInput = document.getElementById('search-input');
        const filterButtonsContainer = document.getElementById('filter-buttons-container');
        const sortButtons = document.querySelectorAll('.sort-btn');
        const noResultsMessage = document.getElementById('no-results');
        const loadingState = document.getElementById('loading-state');
        const addNewDocBtn = document.getElementById('add-new-doc-btn');
        const backButton = document.getElementById('back-button');
        const courseNavLinksContainer = document.getElementById('course-nav-links');
        const userIdDisplay = document.getElementById('user-id');

        // Modal-related elements
        const addModal = document.getElementById('add-modal');
        const addForm = document.getElementById('add-form');
        const addTypeSelect = document.getElementById('add-type');
        const addCourseFields = document.getElementById('add-course-fields');
        const imagePromptInput = document.getElementById('image-prompt');
        const generateImageBtn = document.getElementById('generate-image-btn');

        // --- Utility Functions ---

        function debounce(func, delay) {
            let timeout;
            return function(...args) {
                const context = this;
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(context, args), delay);
            };
        }

        async function fetchWithBackoff(url, options, maxRetries = 5) {
            let retries = 0;
            while (true) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) throw new Error(`API call failed with status: ${response.status}`);
                    return response;
                } catch (error) {
                    if (retries >= maxRetries) {
                        throw error;
                    }
                    const delay = Math.pow(2, retries) * 1000 + Math.random() * 1000;
                    retries++;
                    await new Promise(resolve => setTimeout(resolve, delay));
                }
            }
        }

        function closeModal(modalElement) {
            modalElement.classList.remove('open');
        }

        function openModal(modalElement) {
            closeModal(addModal);
            closeModal(editModal);
            closeModal(deleteModal);
            modalElement.classList.add('open');
        }

        function handleNavLinkClick(event) {
            const href = event.currentTarget.getAttribute('href');
            if (href && href.startsWith('#')) {
                event.preventDefault();
                const targetId = href.substring(1);
                const targetElement = document.getElementById(targetId);
                if (targetElement) {
                    window.scrollTo({
                        top: targetElement.offsetTop - 100, 
                        behavior: 'smooth'
                    });
                }
            }
        }
        
        function showCourseDetail(course) {
            activeCourse = course;
            mainLibraryView.classList.add('hidden');
            mainHeader.classList.add('hidden');
            courseDetailView.classList.remove('hidden');

            document.getElementById('course-title').textContent = course.title;
            document.getElementById('course-department').textContent = course.department;
            document.getElementById('course-instructor').textContent = course.instructor;
            document.getElementById('course-description').textContent = course.description;

            courseNavLinksContainer.innerHTML = '';

            // --- FIX STARTS HERE ---
            // The course.nav property might be a JSON string from the seed data,
            // or an array for newly created courses. This handles both cases.
            let navItems = [];
            if (course.nav) {
                if (typeof course.nav === 'string') {
                    try {
                        // Attempt to parse the string into an array
                        navItems = JSON.parse(course.nav);
                    } catch (e) {
                        console.error("Failed to parse course navigation JSON:", e);
                        navItems = []; // Default to an empty array on parsing error
                    }
                } else if (Array.isArray(course.nav)) {
                    // If it's already an array, use it directly
                    navItems = course.nav;
                }
            }
            // --- FIX ENDS HERE ---

            navItems.forEach(navItem => {
                const navLink = document.createElement('a');
                navLink.href = navItem.link;
                navLink.className = 'flex items-center gap-2 w-full text-left py-2 px-4 rounded-lg font-medium transition-colors duration-200 text-gray-700 hover:bg-gray-100';
                navLink.innerHTML = `<i class="ph ph-link text-lg"></i><span>${navItem.title}</span>`;

                if (navItem.link && !navItem.link.startsWith('#')) {
                    navLink.target = '_blank';
                    navLink.rel = 'noopener noreferrer';
                } else {
                    navLink.addEventListener('click', handleNavLinkClick);
                }
                
                courseNavLinksContainer.appendChild(navLink);
            });

            const resourcesContainer = document.getElementById('course-resources');
            // Use a defensive check for resources as well
            resourcesContainer.innerHTML = (course.resources || []).map(resource => `
                <span class="text-xs font-semibold px-2 py-1 rounded-full text-gray-700 bg-gray-100">${resource}</span>
            `).join('');
        }
        
        function showMainLibrary() {
            courseDetailView.classList.add('hidden');
            mainLibraryView.classList.remove('hidden');
            mainHeader.classList.remove('hidden');

        function sortDocuments(docs) {
            return docs.sort((a, b) => {
                const valueA = a[currentSort];
                const valueB = b[currentSort];
                
                if (currentSort === 'date') {
                    return new Date(valueB) - new Date(valueA);
                } else {
                    return (valueA || '').localeCompare(valueB || '');
                }
            });
        }

        function renderDocuments() {
            loadingState.classList.add('hidden');
            
            const filteredByType = currentFilter === 'all'
                ? allDocuments
                : allDocuments.filter(doc => doc.type === currentFilter);
            
            const filteredBySearch = filteredByType.filter(doc => 
                (doc.title || '').toLowerCase().includes(currentSearch.toLowerCase()) ||
                (doc.author || '').toLowerCase().includes(currentSearch.toLowerCase()) ||
                (doc.type || '').toLowerCase().includes(currentSearch.toLowerCase())
            );

            const sortedDocuments = sortDocuments(filteredBySearch);
            documentGrid.innerHTML = '';
            
            if (sortedDocuments.length > 0) {
                noResultsMessage.classList.add('hidden');
                documentGrid.classList.remove('hidden');
                sortedDocuments.forEach(doc => {
                    documentGrid.appendChild(renderDocumentCard(doc));
                });
            } else {
                noResultsMessage.classList.remove('hidden');
                documentGrid.classList.add('hidden');
            }
        }

        function renderDocumentCard(doc) {
            const card = document.createElement('div');
            card.className = 'bg-white rounded-xl shadow-md p-6 flex flex-col justify-between transition-transform duration-300 hover:scale-[1.02] hover:shadow-xl border border-gray-200';
            
            const contentDiv = document.createElement('div');
            
            const previewContainer = document.createElement('div');
            previewContainer.className = 'uploaded-file-container mb-4';

            if (doc.imageData) {
                previewContainer.classList.add('is-image');
                const imageEl = document.createElement('img');
                imageEl.src = `data:image/png;base64,${doc.imageData}`;
                imageEl.alt = "AI Generated image";
                previewContainer.appendChild(imageEl);
            } else if (doc.filename && doc.filename.endsWith('.pdf')) {
                previewContainer.classList.add('is-pdf');
                const iconEl = document.createElement('i');
                iconEl.className = 'ph ph-file-pdf text-4xl';
                const nameEl = document.createElement('span');
                nameEl.className = 'text-sm font-medium text-center line-clamp-2';
                nameEl.textContent = doc.filename;
                previewContainer.appendChild(iconEl);
                previewContainer.appendChild(nameEl);
            } else if (doc.imageLink) {
                previewContainer.classList.add('is-image');
                const imageEl = document.createElement('img');
                imageEl.src = doc.imageLink;
                imageEl.alt = "Uploaded image";
                imageEl.onerror = () => {
                    imageEl.src = `https://placehold.co/120x120/e2e8f0/64748b?text=Broken%20Link`;
                    imageEl.alt = "Broken link placeholder";
                };
                previewContainer.appendChild(imageEl);
            } else {
                previewContainer.classList.add('is-pdf');
                const iconEl = document.createElement('i');
                const iconClass = doc.type === '论文' ? 'ph ph-scroll-simple-text' : 
                                  doc.type === '讲义' ? 'ph ph-file-pdf' :
                                  doc.type === '笔记' ? 'ph ph-notepad' :
                                  'ph ph-monitor-play';
                iconEl.className = `${iconClass} text-4xl`;
                const nameEl = document.createElement('span');
                nameEl.className = 'text-sm font-medium text-center line-clamp-2';
                nameEl.textContent = doc.type;
                previewContainer.appendChild(iconEl);
                previewContainer.appendChild(nameEl);
            }

            contentDiv.appendChild(previewContainer);

            const typeSpan = document.createElement('span');
            typeSpan.className = 'inline-block text-xs font-semibold px-2 py-1 rounded-full text-indigo-700 bg-indigo-100 mb-3';
            typeSpan.textContent = doc.type;
            contentDiv.appendChild(typeSpan);

            const titleH4 = document.createElement('h4');
            titleH4.className = 'text-lg font-bold text-gray-800 line-clamp-2 mb-2';
            titleH4.textContent = doc.title;
            contentDiv.appendChild(titleH4);

            const authorP = document.createElement('p');
            authorP.className = 'text-sm text-gray-500 line-clamp-1 mb-4';
            authorP.textContent = `作者: ${doc.author}`;
            contentDiv.appendChild(authorP);
            
            const footerDiv = document.createElement('div');
            footerDiv.className = 'flex items-center space-x-2 mt-auto pt-4 border-t border-gray-100';
            
            const viewButton = document.createElement('button');
            viewButton.className = 'flex-1 text-center py-2 px-4 rounded-md font-medium text-white bg-indigo-600 hover:bg-indigo-700 transition-colors duration-200 flex items-center justify-center';
            viewButton.innerHTML = `<i class="ph ph-eye text-lg mr-2"></i> 查看`;
            if (doc.type === '网课') {
                viewButton.addEventListener('click', () => showCourseDetail(doc));
            } else {
                const link = doc.link || (doc.imageData ? `data:image/png;base64,${doc.imageData}` : doc.imageLink);
                if (link) {
                    viewButton.addEventListener('click', () => window.open(link, '_blank'));
                } else {
                    viewButton.disabled = true;
                    viewButton.classList.add('bg-gray-400', 'cursor-not-allowed', 'hover:bg-gray-400');
                    viewButton.classList.remove('bg-indigo-600', 'hover:bg-indigo-700');
                }
            }
            footerDiv.appendChild(viewButton);

            const editButton = document.createElement('button');
            editButton.className = 'p-2 rounded-md text-gray-500 hover:text-indigo-600 hover:bg-gray-100 transition-colors duration-200';
            editButton.innerHTML = `<i class="ph ph-pencil-simple text-lg"></i>`;
            editButton.addEventListener('click', () => handleEditClick(doc));
            footerDiv.appendChild(editButton);

            const deleteButton = document.createElement('button');
            deleteButton.className = 'p-2 rounded-md text-gray-500 hover:text-red-600 hover:bg-gray-100 transition-colors duration-200';
            deleteButton.innerHTML = `<i class="ph ph-trash-simple text-lg"></i>`;
            deleteButton.addEventListener('click', () => handleDeleteClick(doc.id));
            footerDiv.appendChild(deleteButton);
            
            card.appendChild(contentDiv);
            card.appendChild(footerDiv);
            
            return card;
        }

        // --- Event Handlers ---
        
        filterButtonsContainer.addEventListener('click', (e) => {
            const btn = e.target.closest('.filter-btn');
            if (btn) {
                currentFilter = btn.dataset.filter;
                document.querySelectorAll('.filter-btn').forEach(b => {
                    b.classList.remove('bg-indigo-100', 'text-indigo-700');

            openModal(editModal);

        addForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitAddBtn.disabled = true;

            const newDoc = {
                title: document.getElementById('add-title').value,
                type: addTypeSelect.value,
                author: document.getElementById('add-author').value,
                date: new Date().toISOString(),
                link: addLinkInput.value,
            };

            if (newDoc.type === '网课') {
                newDoc.description = document.getElementById('add-course-description').value;
                newDoc.instructor = document.getElementById('add-course-instructor').value;
                newDoc.department = document.getElementById('add-course-department').value;
                try {
                    newDoc.resources = document.getElementById('add-course-resources').value.split(',').map(s => s.trim()).filter(s => s);
                } catch { newDoc.resources = []; }
                try {
                    newDoc.nav = JSON.parse(document.getElementById('add-course-nav').value);
                } catch { newDoc.nav = []; }
            }

            if (imagePreview.src && !imagePreview.src.startsWith('https://placehold.co')) {
                newDoc.imageData = imagePreview.src.split(',')[1];
            } else if (fileUploadInput.files.length > 0) {
                const file = fileUploadInput.files[0];
                newDoc.filename = file.name;
                if (file.type.startsWith('image/')) {
                    newDoc.imageLink = URL.createObjectURL(file); // Note: This is a temporary local URL
                } else if (file.type === 'application/pdf') {
                    newDoc.link = URL.createObjectURL(file);
                }
            }

            try {
                await addDoc(documentsCollectionRef, newDoc);
                addForm.reset();
                closeModal(addModal);
            } catch (e) {
                console.error("Error adding document: ", e);
            } finally {
                submitAddBtn.disabled = false;
            }
        });

        editForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const docId = editDocIdInput.value;
            const updatedData = {
                title: editTitleInput.value,
                author: editAuthorInput.value,
                type: editTypeSelect.value,
            };

            try {
                const docRef = doc(db, `artifacts/${appId}/users/${userId}/documents`, docId);
                await updateDoc(docRef, updatedData);
                closeModal(editModal);
            } catch (e) {
                console.error("Error updating document: ", e);
            }
        });

        generateImageBtn.addEventListener('click', async () => {
            const prompt = imagePromptInput.value;
            if (!prompt) {
                console.error("Please enter a prompt for the AI image.");
                return;
            }

            imageLoadingOverlay.classList.remove('hidden');
            imagePreviewContainer.classList.remove('hidden');
            generateImageBtn.disabled = true;

            try {
                const payload = { instances: [{ prompt }], parameters: { "sampleCount": 1 } };
                const apiKey = "";
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/imagen-3.0-generate-002:predict?key=${apiKey}`;
                
                const response = await fetchWithBackoff(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                
                if (result.predictions?.[0]?.bytesBase64Encoded) {
                    const base64Data = result.predictions[0].bytesBase64Encoded;
                    imagePreview.src = `data:image/png;base64,${base64Data}`;
                    fileUploadInput.disabled = true;
                    addLinkInput.disabled = true;
                } else {
                    imagePreview.src = `https://placehold.co/120x120/e2e8f0/64748b?text=Error`;
                }
            } catch (error) {
                console.error('Error generating AI image:', error);
                imagePreview.src = `https://placehold.co/120x120/e2e8f0/64748b?text=Error`;
            } finally {
                imageLoadingOverlay.classList.add('hidden');
                generateImageBtn.disabled = false;
            }
        });

        clearImageBtn.addEventListener('click', () => {
            imagePreview.src = '';
            imagePromptInput.value = '';
            imagePreviewContainer.classList.add('hidden');
            fileUploadInput.disabled = false;
            addLinkInput.disabled = false;
        });
        
        fileUploadInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                uploadedFilePreviewContainer.classList.remove('hidden');
                imagePromptInput.disabled = true;
                generateImageBtn.disabled = true;
                addLinkInput.disabled = true;

                if (file.type.startsWith('image/')) {
                    uploadedFileContainer.className = 'uploaded-file-container is-image';
                    uploadedFileIcon.classList.add('hidden');
                    uploadedFileName.classList.add('hidden');
                    uploadedImagePreview.classList.remove('hidden');
                    uploadedImagePreview.src = URL.createObjectURL(file);
                } else if (file.type === 'application/pdf') {
                    uploadedFileContainer.className = 'uploaded-file-container is-pdf';
                    uploadedImagePreview.classList.add('hidden');
                    uploadedFileIcon.classList.remove('hidden');
                    uploadedFileName.classList.remove('hidden');
                    uploadedFileIcon.className = 'ph ph-file-pdf text-4xl';
                    uploadedFileName.textContent = file.name;
                }
            } else {
                clearUploadedFileBtn.click();
            }
        });

        clearUploadedFileBtn.addEventListener('click', () => {
            fileUploadInput.value = '';
            uploadedFilePreviewContainer.classList.add('hidden');
            imagePromptInput.disabled = false;
            generateImageBtn.disabled = false;
            addLinkInput.disabled = false;
        });

        addLinkInput.addEventListener('input', (e) => {
            if (e.target.value) {
                imagePromptInput.disabled = true;
                generateImageBtn.disabled = true;
                fileUploadInput.disabled = true;
            } else {
                imagePromptInput.disabled = false;
                generateImageBtn.disabled = false;
                fileUploadInput.disabled = false;
            }
        });

        // --- Firebase Auth and Data Retrieval ---
        onAuthStateChanged(auth, async (user) => {
            if (unsubscribe) unsubscribe(); // Clean up previous listener if auth state changes

            if (user) {
                userId = user.uid;
                userIdDisplay.textContent = `用户ID: ${userId}`;
                documentsCollectionRef = collection(db, `artifacts/${appId}/users/${userId}/documents`);
                
                unsubscribe = onSnapshot(documentsCollectionRef, (snapshot) => {
                    if (snapshot.empty) {
                        // NEW: If the database is empty, add placeholder data
                        seedInitialData();
                    }
                    allDocuments = snapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    }));
                    renderDocuments();
                }, (error) => {
                    console.error("Error listening to document changes:", error);
                });

            } else {
                try {
                    if (authToken) {
                        await signInWithCustomToken(auth, authToken);
                    } else {
                        await signInAnonymously(auth);
                    }
                } catch (error) {
                    console.error("Authentication failed:", error);
                    loadingState.innerHTML = '<p>认证失败，请刷新页面重试。</p>';
                }
            }
        });
