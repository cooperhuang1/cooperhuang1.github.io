<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDUT 评课社区</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Base styles */
        body {
            font-family: 'Inter', sans-serif;
            /* Using a more vibrant and flowing gradient for the background to enhance glass effect */
            background: linear-gradient(135deg, #89a8ff, #a7d9ff, #c7e0f2); /* Brighter, more dynamic gradient */
            background-size: 400% 400%; /* Larger background for animation */
            animation: gradientAnimation 18s ease infinite; /* Slower, smoother animation */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem; /* Increased padding */
        }

        /* Keyframe animation for fluid background */
        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 960px;
            width: 100%;
            padding: 2.5rem; /* More generous padding inside container */
            background: rgba(255, 255, 255, 0.15); /* Slightly less opaque for better transparency */
            backdrop-filter: blur(30px); /* Stronger blur for more frosted effect */
            -webkit-backdrop-filter: blur(30px); /* For Safari support */
            border-radius: 25px; /* More rounded corners, matching image */
            border: 1px solid rgba(255, 255, 255, 0.4); /* Clearer, subtle white border */
            box-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.25); /* Deeper shadow for elevation */
            transition: all 0.3s ease-in-out;
        }

        .card {
            background: rgba(255, 255, 255, 0.1); /* Very light transparency for inner cards */
            border-radius: 18px; /* Consistent rounded corners */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); /* Subtle shadow for depth */
            padding: 28px; /* Increased padding for content */
            backdrop-filter: blur(15px); /* Slightly less blur than container */
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2); /* Inner card border */
            transition: all 0.3s ease-in-out;
        }

        .card:hover {
            transform: translateY(-7px); /* More pronounced lift effect on hover */
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.25); /* Deeper shadow on hover */
        }

        .btn-primary {
            background-color: #5a7dff; /* A vibrant blue for buttons */
            color: white;
            padding: 14px 28px; /* Larger buttons */
            border-radius: 10px; /* More rounded buttons */
            transition: all 0.3s ease;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2); /* Stronger button shadow */
            border: none;
        }
        .btn-primary:hover {
            background-color: #436ceb; /* Darker blue on hover */
            transform: translateY(-3px); /* Slight lift effect */
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }

        .star-rating .star {
            cursor: pointer;
            color: #d1d5db; /* Gray-400 (unselected) */
            font-size: 2.2rem; /* Slightly larger stars */
            transition: color 0.2s ease, transform 0.2s ease;
        }
        .star-rating .star.selected {
            color: #facc15; /* Full yellow (selected) */
        }
        .star-rating .star.half-selected {
            background: linear-gradient(to right, #facc15 50%, #d1d5db 50%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-fill-color: transparent;
        }
        /* Smaller stars for average ratings in aggregated view */
        .aggregated-star-display .star {
            font-size: 1.4rem; /* Slightly larger for clarity in aggregated view */
        }


        /* Input, textarea, and select styling for glass effect */
        input[type="text"],
        textarea,
        select {
            background: rgba(255, 255, 255, 0.25); /* More transparent input fields */
            border: 1px solid rgba(255, 255, 255, 0.5); /* Stronger subtle border */
            color: #222; /* Darker text for readability */
            padding: 0.9rem; /* Increased padding */
            border-radius: 10px; /* More rounded corners */
            transition: all 0.3s ease;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292%22%20height%3D%22292%22%3E%3Cpath%20fill%3D%22%23333%22%20d%3D%22M287%2069L146%20208%205%2069z%22%2F%3E%3C%2Fsvg%3E');
            background-repeat: no-repeat;
            background-position: right 1em top 50%; /* Adjusted arrow position */
            background-size: .75em auto; /* Larger arrow */
        }

        input[type="text"]::placeholder,
        textarea::placeholder {
            color: rgba(34, 34, 34, 0.6); /* Lighter placeholder text */
        }

        input[type="text"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #5a7dff; /* Highlight on focus */
            box-shadow: 0 0 0 4px rgba(90, 125, 255, 0.4); /* Stronger glow */
            background-color: rgba(255, 255, 255, 0.35); /* Slightly less transparent on focus */
        }

        /* Text colors for better contrast on glass background */
        h1, h2, h3 {
            color: #1a202c; /* Even darker text for headings */
        }
        label, p {
            color: #2d3748; /* Darker for labels and paragraphs */
        }
        .text-gray-600 {
            color: #4a5568;
        }
        .text-indigo-600 {
            color: #4f46e5;
        }
        .text-blue-500 {
            color: #3b82f6;
        }

        /* Loading spinner */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #5a7dff;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Custom Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.5); /* Slightly darker overlay */
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: rgba(255, 255, 255, 0.9); /* More opaque modal background */
            backdrop-filter: blur(20px); /* Stronger blur for modal */
            -webkit-backdrop-filter: blur(20px);
            margin: auto;
            padding: 30px; /* More padding */
            border-radius: 15px; /* More rounded */
            box-shadow: 0 8px 25px rgba(0,0,0,0.4); /* Deeper shadow */
            width: 85%;
            max-width: 450px; /* Slightly larger default modal */
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.5); /* Clearer modal border */
        }
        /* Override for larger comments modal */
        .modal-content.comments-modal {
            max-width: 650px; /* Larger comments modal */
            text-align: left;
            padding: 30px;
        }

        .close-button {
            color: #aaa;
            float: right;
            font-size: 32px; /* Larger close button */
            font-weight: bold;
            line-height: 1; /* Adjust line-height for better alignment */
        }
        .close-button:hover,
        .close-button:focus {
            color: #5a7dff;
            text-decoration: none;
            cursor: pointer;
        }

        /* Animation for new review entries */
        @keyframes slideInFromBottom {
            0% {
                opacity: 0;
                transform: translateY(30px); /* Start further down */
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .review-entry-animation {
            animation: slideInFromBottom 0.6s ease-out forwards; /* Slightly longer, smoother animation */
        }

        /* Page navigation styles */
        .nav-button {
            padding: 12px 25px; /* Larger nav buttons */
            border-radius: 10px;
            background-color: rgba(255, 255, 255, 0.25); /* More transparent */
            backdrop-filter: blur(8px); /* Slightly more blur for nav buttons */
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.4); /* Clearer border */
            color: #2c3e50; /* Darker text */
            font-weight: 600; /* Bolder font */
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .nav-button.active {
            background-color: #5a7dff;
            color: white;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.25);
            border-color: #5a7dff;
        }

        .nav-button:hover:not(.active) {
            background-color: rgba(255, 255, 255, 0.4); /* More transparent on hover */
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        /* Page content sections */
        .page-content {
            display: none; /* Hidden by default */
        }
        .page-content.active {
            display: block; /* Shown when active */
        }
    </style>
</head>
<body class="p-4">
    <div class="container mx-auto p-6 mt-8 mb-8">
        <h1 class="text-4xl font-bold text-center mb-8">CDUT 评课社区</h1>

        <!-- User ID display -->
        <div class="mb-6 text-center text-gray-600">
            您的用户ID：<span id="userIdDisplay" class="font-semibold text-indigo-600 break-all">加载中...</span>
        </div>

        <!-- Navigation Buttons -->
        <div class="flex justify-center space-x-4 mb-8">
            <button id="navSubmit" class="nav-button active" data-page="submit">提交评价</button>
            <button id="navSearch" class="nav-button" data-page="search">搜索评价</button>
            <button id="navAllReviews" class="nav-button" data-page="allReviews">所有评价</button>
        </div>

        <!-- Page: Submit Review -->
        <div id="pageSubmit" class="page-content active">
            <div class="card">
                <h2 class="text-2xl font-semibold mb-4">提交您的评价</h2>
                <form id="reviewForm">
                    <div class="mb-4">
                        <label for="courseName" class="block text-sm font-medium mb-2">课程名称：</label>
                        <input type="text" id="courseName" class="w-full p-3 rounded-lg focus:ring-2 focus:ring-indigo-500" placeholder="例如：高等数学" required>
                    </div>
                    <div class="mb-4">
                        <label for="professorName" class="block text-sm font-medium mb-2">教师姓名：</label>
                        <input type="text" id="professorName" class="w-full p-3 rounded-lg focus:ring-2 focus:ring-indigo-500" placeholder="例如：张三" required>
                    </div>
                    <div class="mb-4">
                        <label for="rating" class="block text-sm font-medium mb-2">综合评分：</label>
                        <div id="starRating" class="star-rating flex justify-center space-x-2">
                            <span class="star" data-value="1">&#9733;</span>
                            <span class="star" data-value="2">&#9733;</span>
                            <span class="star" data-value="3">&#9733;</span>
                            <span class="star" data-value="4">&#9733;</span>
                            <span class="star" data-value="5">&#9733;</span>
                        </div>
                        <input type="hidden" id="rating" value="0">
                    </div>
                    <div class="mb-4">
                        <label for="difficultyRating" class="block text-sm font-medium mb-2">课程难度：</label>
                        <select id="difficultyRating" class="w-full p-3 rounded-lg focus:ring-2 focus:ring-indigo-500" required>
                            <option value="">请选择</option>
                            <option value="极其简单">极其简单</option>
                            <option value="简单">简单</option>
                            <option value="一般">一般</option>
                            <option value="有点难">有点难</option>
                            <option value="很难">很难</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label for="gradingRating" class="block text-sm font-medium mb-2">给分好坏：</label>
                        <select id="gradingRating" class="w-full p-3 rounded-lg focus:ring-2 focus:ring-indigo-500" required>
                            <option value="">请选择</option>
                            <option value="给分很好">给分很好</option>
                            <option value="给分好">给分好</option>
                            <option value="给分一般">给分一般</option>
                            <option value="给分有点差">给分有点差</option>
                            <option value="给分很差">给分很差</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label for="homeworkRating" class="block text-sm font-medium mb-2">作业多少：</label>
                        <select id="homeworkRating" class="w-full p-3 rounded-lg focus:ring-2 focus:ring-indigo-500" required>
                            <option value="">请选择</option>
                            <option value="很少">很少</option>
                            <option value="较少">较少</option>
                            <option value="适中">适中</option>
                            <option value="较多">较多</option>
                            <option value="很多">很多</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label for="learningGainRating" class="block text-sm font-medium mb-2">收获大小：</label>
                        <select id="learningGainRating" class="w-full p-3 rounded-lg focus:ring-2 focus:ring-indigo-500" required>
                            <option value="">请选择</option>
                            <option value="收获非常少">收获非常少</option>
                            <option value="收获较少">收获较少</option>
                            <option value="收获一般">收获一般</option>
                            <option value="收获较多">收获较多</option>
                            <option value="收获非常多">收获非常多</option>
                        </select>
                    </div>
                    <div class="mb-6">
                        <label for="comment" class="block text-sm font-medium mb-2">评价内容：</label>
                        <textarea id="comment" class="w-full p-3 rounded-lg focus:ring-2 focus:ring-indigo-500 h-32" placeholder="请分享您的学习体验和建议..." required></textarea>
                    </div>
                    <button type="submit" class="w-full btn-primary font-semibold">提交评价</button>
                </form>
            </div>
        </div>

        <!-- Page: Search Reviews -->
        <div id="pageSearch" class="page-content">
            <div class="card">
                <h2 class="text-2xl font-semibold mb-4">搜索评价</h2>
                <div class="mb-4">
                    <input type="text" id="searchKeyword" class="w-full p-3 rounded-lg focus:ring-2 focus:ring-indigo-500" placeholder="输入关键词搜索...">
                </div>
                <div class="flex items-center space-x-4 mb-6">
                    <label class="inline-flex items-center">
                        <input type="radio" name="searchType" value="courseName" class="form-radio text-indigo-600 h-5 w-5" checked>
                        <span class="ml-2 text-gray-700">按课程名称</span>
                    </label>
                    <label class="inline-flex items-center">
                        <input type="radio" name="searchType" value="professorName" class="form-radio text-indigo-600 h-5 w-5">
                        <span class="ml-2 text-gray-700">按教师姓名</span>
                    </label>
                </div>
                <h3 class="text-xl font-semibold mb-4">搜索结果</h3>
                <div id="searchResultsList" class="space-y-6">
                    <p class="text-center text-gray-500">请在上方输入关键词进行搜索。</p>
                </div>
            </div>
        </div>

        <!-- Page: All Reviews -->
        <div id="pageAllReviews" class="page-content">
            <div class="card">
                <h2 class="text-2xl font-semibold mb-4">所有评价</h2>
                <div id="reviewsList" class="space-y-6">
                    <div id="reviewsLoader" class="loader mx-auto my-8"></div>
                    <!-- Aggregated Reviews will be dynamically loaded here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Custom Modal for simple messages (e.g., success/error) -->
    <div id="myModal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <p id="modalMessage" class="text-lg"></p>
            <button id="modalOkButton" class="mt-4 btn-primary">确定</button>
        </div>
    </div>

    <!-- Modal for displaying individual comments for an aggregated course -->
    <div id="commentsModal" class="modal">
        <div class="modal-content comments-modal">
            <span class="close-button comments-modal-close">&times;</span>
            <h3 id="commentsModalTitle" class="text-2xl font-semibold mb-4 text-gray-800"></h3>
            <div id="individualCommentsList" class="space-y-4 text-left">
                <!-- Individual comments will be loaded here -->
            </div>
            <button id="commentsModalOkButton" class="mt-6 btn-primary comments-modal-ok">关闭</button>
        </div>
    </div>

    <script type="module">
        // Import Firebase modules
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js"; // Updated SDK version
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js"; // Updated SDK version
        import { getFirestore, collection, addDoc, onSnapshot, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js"; // Updated SDK version

        // Get Firebase config and App ID from global variables (or default)
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}'); // Use global config
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;


        let app;
        let db;
        let auth;
        let userId = null;
        let isAuthReady = false;
        let unsubscribeReviews = null; // To store the unsubscribe function for reviews listener

        // Get DOM elements for form
        const reviewForm = document.getElementById('reviewForm');
        const courseNameInput = document.getElementById('courseName');
        const professorNameInput = document.getElementById('professorName');
        const commentInput = document.getElementById('comment');
        
        // Specific select elements
        const difficultySelect = document.getElementById('difficultyRating');
        const gradingSelect = document.getElementById('gradingRating');
        const homeworkSelect = document.getElementById('homeworkRating');
        const learningGainSelect = document.getElementById('learningGainRating');

        // Page elements
        const navSubmitButton = document.getElementById('navSubmit');
        const navSearchButton = document.getElementById('navSearch');
        const navAllReviewsButton = document.getElementById('navAllReviews');
        const pageSubmit = document.getElementById('pageSubmit');
        const pageSearch = document.getElementById('pageSearch');
        const pageAllReviews = document.getElementById('pageAllReviews');

        const reviewsList = document.getElementById('reviewsList'); // For "All Reviews" page
        const reviewsLoader = document.getElementById('reviewsLoader');
        const userIdDisplay = document.getElementById('userIdDisplay');

        // Search elements
        const searchKeywordInput = document.getElementById('searchKeyword');
        const searchTypeRadios = document.querySelectorAll('input[name="searchType"]');
        const searchResultsList = document.getElementById('searchResultsList'); // For "Search Reviews" page

        // Modal elements for simple messages
        const modal = document.getElementById('myModal');
        const modalMessage = document.getElementById('modalMessage');
        const closeButton = document.querySelector('.close-button');
        const modalOkButton = document.getElementById('modalOkButton');

        // Modal elements for comments details
        const commentsModal = document.getElementById('commentsModal');
        const commentsModalTitle = document.getElementById('commentsModalTitle');
        const individualCommentsList = document.getElementById('individualCommentsList');
        const commentsModalCloseButton = document.querySelector('.comments-modal-close');
        const commentsModalOkButton = document.querySelector('.comments-modal-ok');


        // Function to show custom modal (for simple messages)
        function showModal(message) {
            modalMessage.textContent = message;
            modal.style.display = 'flex';
        }

        // Close modal event listeners for simple messages
        closeButton.onclick = function() {
            modal.style.display = 'none';
        }
        modalOkButton.onclick = function() {
            modal.style.display = 'none';
        }
        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }

        // Helper function to get star HTML for display (for comprehensive rating)
        function getStarDisplayHtml(rating) {
            let starsHtml = '';
            const fullStars = Math.floor(rating);
            const hasHalfStar = rating % 1 !== 0;

            for (let i = 1; i <= 5; i++) {
                if (i <= fullStars) {
                    starsHtml += '<span class="text-yellow-400">&#9733;</span>';
                } else if (hasHalfStar && i === fullStars + 1) {
                    starsHtml += '<span class="star half-selected">&#9733;</span>';
                } else {
                    starsHtml += '<span class="text-gray-300">&#9733;</span>';
                }
            }
            return starsHtml;
        }

        // Function to show comments modal
        function showCommentsModal(course, professor, comments) {
            commentsModalTitle.textContent = `${course} - ${professor} 的所有评价`;
            individualCommentsList.innerHTML = ''; // Clear previous comments

            if (comments.length === 0) {
                individualCommentsList.innerHTML = '<p class="text-gray-500">暂无详细评价。</p>';
            } else {
                // Sort comments by timestamp (latest first) within the modal
                comments.sort((a, b) => {
                    const dateA = a.timestamp && typeof a.timestamp === 'object' && a.timestamp.seconds !== undefined 
                                ? new Date(a.timestamp.seconds * 1000 + a.timestamp.nanoseconds / 1000000) 
                                : new Date(0);
                    const dateB = b.timestamp && typeof b.timestamp === 'object' && b.timestamp.seconds !== undefined 
                                ? new Date(b.timestamp.seconds * 1000 + b.timestamp.nanoseconds / 1000000) 
                                : new Date(0);
                    return dateB.getTime() - dateA.getTime();
                });

                comments.forEach(comment => {
                    const commentElement = document.createElement('div');
                    commentElement.className = 'p-4 bg-gray-50 rounded-lg shadow-sm border border-gray-200';
                    
                    const displayDate = comment.timestamp && typeof comment.timestamp === 'object' && comment.timestamp.seconds !== undefined 
                                        ? new Date(comment.timestamp.seconds * 1000 + comment.timestamp.nanoseconds / 1000000).toLocaleString() 
                                        : '未知时间';
                    
                    commentElement.innerHTML = `
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-sm font-medium text-gray-700">综合评分: ${getStarDisplayHtml(comment.rating)} (${comment.rating})</span>
                            <span class="text-xs text-gray-500">${displayDate}</span>
                        </div>
                        <div class="text-sm text-gray-600 mb-2 grid grid-cols-2 gap-2">
                            <div>课程难度: <span class="font-semibold">${comment.difficulty || 'N/A'}</span></div>
                            <div>给分好坏: <span class="font-semibold">${comment.grading || 'N/A'}</span></div>
                            <div>作业多少: <span class="font-semibold">${comment.homework || 'N/A'}</span></div>
                            <div>收获大小: <span class="font-semibold">${comment.learningGain || 'N/A'}</span></div>
                        </div>
                        <p class="text-gray-600 mb-2">${comment.comment}</p>
                        <p class="text-xs text-gray-500">提交人: <span class="font-medium text-blue-500 break-all">${comment.userId}</span></p>
                    `;
                    individualCommentsList.appendChild(commentElement);
                });
            }
            commentsModal.style.display = 'flex';
        }

        // Close comments modal event listeners
        commentsModalCloseButton.onclick = function() {
            commentsModal.style.display = 'none';
        }
        commentsModalOkButton.onclick = function() {
            commentsModal.style.display = 'none';
        }
        window.onclick = function(event) {
            // Close either modal if clicked outside, but prioritize commentsModal if both are open
            if (event.target == commentsModal) {
                commentsModal.style.display = 'none';
            } else if (event.target == modal) {
                modal.style.display = 'none';
            }
        }


        // Initialize Firebase
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);

            // Listen for authentication state changes
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    userId = user.uid;
                    userIdDisplay.textContent = userId;
                    isAuthReady = true;
                    console.log("Firebase initialized and user authenticated:", userId);
                    showPage('submit'); // Set initial page to Submit
                } else {
                    if (initialAuthToken) {
                        try {
                            await signInWithCustomToken(auth, initialAuthToken);
                        } catch (customTokenError) {
                            console.warn("Custom token sign-in failed, attempting anonymous sign-in:", customTokenError);
                            try {
                                await signInAnonymously(auth);
                            } catch (anonymousError) {
                                console.error("Anonymous sign-in also failed:", anonymousError);
                                showModal("认证失败，请刷新页面重试。");
                            }
                        }
                    } else {
                        try {
                            await signInAnonymously(auth);
                        } catch (anonymousError) {
                            console.error("Anonymous sign-in failed:", anonymousError);
                            showModal("认证失败，请刷新页面重试。");
                        }
                    }
                }
            });
        } catch (error) {
            console.error("Failed to initialize Firebase:", error);
            showModal("Firebase 初始化失败，请检查配置。");
        }

        // Generic Star rating logic setup function (only for comprehensive rating)
        function setupStarRating(containerId, inputId) {
            const container = document.getElementById(containerId);
            const input = document.getElementById(inputId);
            let currentRating = 0; // Initialize to 0

            container.addEventListener('click', (e) => {
                if (e.target.classList.contains('star')) {
                    const starElement = e.target;
                    const rect = starElement.getBoundingClientRect();
                    const clickX = e.clientX - rect.left;
                    const starWidth = rect.width;
                    const baseValue = parseFloat(starElement.dataset.value);

                    const isHalf = clickX < starWidth / 2;
                    let newValue;

                    if (isHalf) {
                        newValue = baseValue - 0.5;
                    } else {
                        newValue = baseValue;
                    }
                    
                    currentRating = newValue;
                    input.value = newValue;
                    updateStars(container, currentRating);
                }
            });

            function updateStars(containerElement, ratingValue) {
                const stars = containerElement.querySelectorAll('.star');
                stars.forEach((star, index) => {
                    const starValue = index + 1;

                    star.classList.remove('selected', 'half-selected');

                    if (ratingValue >= starValue) {
                        star.classList.add('selected');
                    } else if (ratingValue > (starValue - 1) && ratingValue < starValue) {
                        star.classList.add('half-selected');
                    }
                });
            }

            // Initialize stars on load
            updateStars(container, currentRating);
            return { // Return functions to update/get from outside
                setRating: (value) => {
                    currentRating = value;
                    input.value = value;
                    updateStars(container, currentRating);
                },
                getRating: () => parseFloat(input.value)
            };
        }

        // Setup comprehensive star rating control
        const mainRatingControl = setupStarRating('starRating', 'rating');


        // Submit review form
        reviewForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!isAuthReady || !userId) {
                showModal("用户认证未完成，请稍候再试。");
                return;
            }

            const courseName = courseNameInput.value.trim();
            const professorName = professorNameInput.value.trim();
            const rating = mainRatingControl.getRating();
            // Read values from select elements directly
            const difficulty = difficultySelect.value;
            const grading = gradingSelect.value;
            const homework = homeworkSelect.value;
            const learningGain = learningGainSelect.value;
            const comment = commentInput.value.trim();

            // Validate that select options are chosen
            if (!courseName || !professorName || rating === 0 || comment === '' || difficulty === '' || grading === '' || homework === '' || learningGain === '') {
                showModal("请填写所有必填项并选择所有评分。");
                return;
            }

            try {
                await addDoc(collection(db, `artifacts/${appId}/public/data/course_reviews`), {
                    courseName,
                    professorName,
                    rating,
                    difficulty, // Storing string value
                    grading,    // Storing string value
                    homework,   // Storing string value
                    learningGain, // Storing string value
                    comment,
                    userId,
                    timestamp: serverTimestamp()
                });

                showModal("评价提交成功！");
                reviewForm.reset();
                mainRatingControl.setRating(0);
                // Reset select elements
                difficultySelect.value = '';
                gradingSelect.value = '';
                homeworkSelect.value = '';
                learningGainSelect.value = '';
            } catch (error) {
                console.error("Error adding document: ", error);
                showModal("提交评价失败，请重试。");
            }
        });

        // Search functionality
        let currentSearchKeyword = '';
        let currentSearchType = 'courseName'; // Default search type for search page

        searchKeywordInput.addEventListener('input', () => {
            currentSearchKeyword = searchKeywordInput.value.trim();
            console.log("搜索关键词:", currentSearchKeyword);
            loadReviews(true); // Always update search results
        });

        searchTypeRadios.forEach(radio => {
            radio.addEventListener('change', (event) => {
                currentSearchType = event.target.value;
                console.log("搜索类型:", currentSearchType);
                loadReviews(true); // Always update search results
            });
        });

        // Load and real-time update review list
        // `isSearchPage` parameter indicates if the call is for the search results page.
        function loadReviews(isSearchPage = false) {
            if (!db || !isAuthReady) {
                console.log("Firestore or Auth not ready, delaying review load.");
                return;
            }

            const targetList = isSearchPage ? searchResultsList : reviewsList;
            const loader = reviewsLoader;

            targetList.innerHTML = '';
            loader.style.display = 'block';

            if (unsubscribeReviews) {
                unsubscribeReviews();
                unsubscribeReviews = null;
            }

            const reviewsCollectionRef = collection(db, `artifacts/${appId}/public/data/course_reviews`);
            const q = query(reviewsCollectionRef);

            unsubscribeReviews = onSnapshot(q, (snapshot) => {
                loader.style.display = 'none';

                const allReviews = [];
                snapshot.forEach((doc) => {
                    allReviews.push(doc.data());
                });
                console.log("所有评价数量:", allReviews.length);

                let reviewsToDisplay = allReviews;

                // Only filter if it's the search page AND there's a keyword
                if (isSearchPage && currentSearchKeyword) {
                    reviewsToDisplay = allReviews.filter(review => {
                        const fieldValue = review[currentSearchType] ? String(review[currentSearchType]).toLowerCase() : '';
                        return fieldValue.includes(currentSearchKeyword.toLowerCase());
                    });
                } else if (!isSearchPage) {
                    // If it's the "All Reviews" page, always show all reviews
                    reviewsToDisplay = allReviews;
                } else if (isSearchPage && !currentSearchKeyword) {
                    // If it's the search page but no keyword, show the initial prompt
                    targetList.innerHTML = '<p class="text-center text-gray-500">请在上方输入关键词进行搜索。</p>';
                    return; // Exit function early if no search keyword on search page
                }


                // Aggregate reviews
                const aggregatedReviews = {};

                // Mapping for calculating averages for non-numeric fields (optional, for display consistency)
                const difficultyMap = { '极其简单': 5, '简单': 4, '一般': 3, '有点难': 2, '很难': 1 };
                const gradingMap = { '给分很好': 5, '给分好': 4, '给分一般': 3, '给分有点差': 2, '给分很差': 1 };
                const homeworkMap = { '很少': 5, '较少': 4, '适中': 3, '较多': 2, '很多': 1 };
                const learningGainMap = { '收获非常少': 1, '收获较少': 2, '收获一般': 3, '收获较多': 4, '收获非常多': 5 };

                reviewsToDisplay.forEach(review => {
                    const key = `${review.courseName}_${review.professorName}`;
                    if (!aggregatedReviews[key]) {
                        aggregatedReviews[key] = {
                            courseName: review.courseName,
                            professorName: review.professorName,
                            totalRating: 0,
                            totalDifficultyNumeric: 0, // For average calculation
                            totalGradingNumeric: 0,
                            totalHomeworkNumeric: 0,
                            totalLearningGainNumeric: 0,
                            reviewCount: 0,
                            comments: [],
                            latestTimestamp: review.timestamp ? (review.timestamp.toDate ? review.timestamp.toDate() : new Date(review.timestamp.seconds * 1000 + review.timestamp.nanoseconds / 1000000)) : new Date(0)
                        };
                    }
                    aggregatedReviews[key].totalRating += (review.rating || 0);
                    // Only add to numeric totals if the string value exists in the map
                    aggregatedReviews[key].totalDifficultyNumeric += (difficultyMap[review.difficulty] !== undefined ? difficultyMap[review.difficulty] : 0);
                    aggregatedReviews[key].totalGradingNumeric += (gradingMap[review.grading] !== undefined ? gradingMap[review.grading] : 0);
                    aggregatedReviews[key].totalHomeworkNumeric += (homeworkMap[review.homework] !== undefined ? homeworkMap[review.homework] : 0);
                    aggregatedReviews[key].totalLearningGainNumeric += (learningGainMap[review.learningGain] !== undefined ? learningGainMap[review.learningGain] : 0);


                    aggregatedReviews[key].reviewCount += 1;
                    aggregatedReviews[key].comments.push(review);
                    const currentReviewTimestamp = review.timestamp ? (review.timestamp.toDate ? review.timestamp.toDate() : new Date(review.timestamp.seconds * 1000 + review.timestamp.nanoseconds / 1000000)) : new Date(0);
                    if (currentReviewTimestamp > aggregatedReviews[key].latestTimestamp) {
                        aggregatedReviews[key].latestTimestamp = currentReviewTimestamp;
                    }
                });

                const aggregatedReviewsArray = Object.values(aggregatedReviews);
                aggregatedReviewsArray.sort((a, b) => b.latestTimestamp - a.latestTimestamp);

                targetList.innerHTML = ''; // Clear content before rendering

                if (aggregatedReviewsArray.length === 0) {
                    if (isSearchPage && currentSearchKeyword) {
                        targetList.innerHTML = '<p class="text-center text-gray-500">没有找到匹配的评价。</p>';
                    } else {
                        targetList.innerHTML = '<p class="text-center text-gray-500">暂无评价，快来成为第一个提交评价的人吧！</p>';
                    }
                } else {
                    aggregatedReviewsArray.forEach(aggregatedReview => {
                        const averageRating = (aggregatedReview.totalRating / aggregatedReview.reviewCount) || 0;
                        const averageDifficulty = (aggregatedReview.totalDifficultyNumeric / aggregatedReview.reviewCount) || 0;
                        const averageGrading = (aggregatedReview.totalGradingNumeric / aggregatedReview.reviewCount) || 0;
                        const averageHomework = (aggregatedReview.totalHomeworkNumeric / aggregatedReview.reviewCount) || 0;
                        const averageLearningGain = (aggregatedReview.totalLearningGainNumeric / aggregatedReview.reviewCount) || 0;
                        
                        const averageRatingRounded = Math.round(averageRating * 10) / 10;
                        const averageDifficultyRounded = Math.round(averageDifficulty * 10) / 10;
                        const averageGradingRounded = Math.round(averageGrading * 10) / 10;
                        const averageHomeworkRounded = Math.round(averageHomework * 10) / 10;
                        const averageLearningGainRounded = Math.round(averageLearningGain * 10) / 10;

                        const aggregatedCardElement = document.createElement('div');
                        aggregatedCardElement.className = 'card p-6 border rounded-lg shadow-sm review-entry-animation cursor-pointer';
                        
                        const commentsForDataset = aggregatedReview.comments.map(c => ({
                            ...c,
                            timestamp: c.timestamp && c.timestamp.seconds !== undefined ? { seconds: c.timestamp.seconds, nanoseconds: c.timestamp.nanoseconds } : c.timestamp
                        }));
                        aggregatedCardElement.dataset.comments = JSON.stringify(commentsForDataset);

                        aggregatedCardElement.innerHTML = `
                            <div class="flex justify-between items-center mb-2">
                                <h3 class="text-xl font-semibold text-gray-700">${aggregatedReview.courseName} - ${aggregatedReview.professorName}</h3>
                                <div class="flex items-center space-x-1">
                                    <span class="aggregated-star-display">${getStarDisplayHtml(averageRating)}</span>
                                    <span class="font-bold text-gray-800 text-xl">${averageRatingRounded}</span>
                                    <span class="text-gray-500 text-sm ml-1">(${aggregatedReview.reviewCount} 评价)</span>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-2 text-sm text-gray-600 mb-3">
                                <div>难度: <span class="aggregated-star-display">${getStarDisplayHtml(averageDifficulty)}</span> (${averageDifficultyRounded})</div>
                                <div>给分: <span class="aggregated-star-display">${getStarDisplayHtml(averageGrading)}</span> (${averageGradingRounded})</div>
                                <div>作业: <span class="aggregated-star-display">${getStarDisplayHtml(averageHomework)}</span> (${averageHomeworkRounded})</div>
                                <div>收获: <span class="aggregated-star-display">${getStarDisplayHtml(averageLearningGain)}</span> (${averageLearningGainRounded})</div>
                            </div>
                            <p class="text-gray-600">点击查看所有评价详情</p>
                        `;
                        targetList.appendChild(aggregatedCardElement);

                        aggregatedCardElement.addEventListener('click', () => {
                            const comments = JSON.parse(aggregatedCardElement.dataset.comments);
                            showCommentsModal(aggregatedReview.courseName, aggregatedReview.professorName, comments);
                        });
                    });
                }
            }, (error) => {
                console.error("Error fetching documents: ", error);
                loader.style.display = 'none';
                targetList.innerHTML = '<p class="text-center text-red-500">加载评价失败，请检查网络连接。</p>';
                showModal("加载评价失败，请检查网络连接。");
            });
        }

        // Page navigation logic
        const pageContents = document.querySelectorAll('.page-content');
        const navButtons = document.querySelectorAll('.nav-button');

        function showPage(pageId) {
            pageContents.forEach(page => {
                page.classList.remove('active');
            });
            navButtons.forEach(button => {
                button.classList.remove('active');
            });

            document.getElementById(`page${pageId.charAt(0).toUpperCase() + pageId.slice(1)}`).classList.add('active');
            document.getElementById(`nav${pageId.charAt(0).toUpperCase() + pageId.slice(1)}`).classList.add('active');

            // Load data specific to the activated page
            if (pageId === 'allReviews') {
                loadReviews(false); // Load all reviews
                // Reset search keyword and type when navigating away from search page
                searchKeywordInput.value = '';
                currentSearchKeyword = '';
                document.querySelector('input[name="searchType"][value="courseName"]').checked = true;
                currentSearchType = 'courseName';
            } else if (pageId === 'search') {
                loadReviews(true); // Load reviews for search page (initially no filter, but ready for input)
            } else if (pageId === 'submit') {
                // No data loading needed for submit page on activation
            }
        }

        navSubmitButton.addEventListener('click', () => showPage('submit'));
        navSearchButton.addEventListener('click', () => showPage('search'));
        navAllReviewsButton.addEventListener('click', () => showPage('allReviews'));

    </script>
</body>
</html>
